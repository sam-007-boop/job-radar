name: resolve-boards
on: workflow_dispatch
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python tools/resolve_ai100.py
      - run: |
          git config user.name "job-radar"; git config user.email "job-radar@users.noreply.github.com"
          git add data/ai100-resolved.json; git commit -m "AI 100 board check" || true; git pull --rebase; git push
