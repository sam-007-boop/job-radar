name: job-radar

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC = 6:30am EDT / 5:30am EST
  workflow_dispatch:         # lets you (or Claude) run it on demand from the Actions tab
    inputs:
      reset_seen:
        description: "Re-report roles already seen today (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python radar.py ${{ inputs.reset_seen && '--reset-seen' || '' }}
      - name: Save results
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "radar run $(TZ=America/New_York date +%F)"
          git push
