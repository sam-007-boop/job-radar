# Companies job-radar checks every morning.
# "verified" sources were confirmed from live job URLs on 2026-10-29.
# "probe" entries are guesses; the first run reports which ones resolve (see data/probe-report.md).
#
# Formats:
#   greenhouse: <board slug>        -> job-boards.greenhouse.io/<slug>
#   lever:      <company slug>      -> jobs.lever.co/<slug>
#   ashby:      <org slug>          -> jobs.ashbyhq.com/<slug>
#   workday:    <tenant>|<wdN>|<site>  -> <tenant>.<wdN>.myworkdayjobs.com/<site>
#   oracle:     <host>|<siteNumber>    -> <host>/hcmUI/CandidateExperience/en/sites/<siteNumber>

