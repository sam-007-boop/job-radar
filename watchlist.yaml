# Companies job-radar checks every morning.
# "verified" sources were confirmed from live job URLs on 2026-10-29.
# "probe" entries are guesses; the first run reports which ones resolve (see data/probe-report.md).
#
# Formats:
#   greenhouse: <board slug>        -> job-boards.greenhouse.io/<slug>
#   lever:      <company slug>      -> jobs.lever.co/<slug>
#   ashby:      <org slug>          -> jobs.ashbyhq.com/<slug>
#   workday:    <tenant>|<wdN>|<site>  -> <tenant>.<wdN>.myworkdayjobs.com/<site>

verified:
  # AI x finance / data centers
  - {name: CoreWeave,           track: AI x finance, greenhouse: coreweave}
  - {name: Anthropic,           track: AI x finance, greenhouse: anthropic}
  - {name: Together AI,         track: AI x finance, greenhouse: togetherai}
  - {name: Crusoe,              track: AI x finance, ashby: Crusoe}
  - {name: Lambda,              track: AI x finance, ashby: Lambda}
  - {name: OpenAI,              track: AI x finance, ashby: openai}
  - {name: Vantage Data Centers, track: AI x finance, workday: "vantagedc|wd1|Vantage"}
  - {name: Intersect Power,     track: AI x finance, lever: intersect}
  # PE / infra
  - {name: Blackstone,          track: PE / infra, workday: "blackstone|wd1|Blackstone_Careers"}
  - {name: Blackstone (campus), track: PE / infra, workday: "blackstone|wd1|Blackstone_Campus_Careers"}
  - {name: BlackRock / GIP,     track: PE / infra, workday: "blackrock|wd1|BlackRock_Professional"}
  - {name: Brookfield,          track: PE / infra, workday: "brookfield|wd5|brookfield"}
  - {name: Ares Management,     track: PE / infra, workday: "aresmgmt|wd1|External"}
  - {name: Apollo,              track: PE / infra, workday: "athene|wd5|Apollo_Careers"}
  - {name: Copia Power,         track: PE / infra, greenhouse: copiapower}
  - {name: Pivot Energy,        track: PE / infra, lever: pivotenergy}
  # IB
  - {name: Houlihan Lokey (lateral), track: IB, workday: "hl|wd1|Lateral"}
  - {name: Houlihan Lokey (campus),  track: IB, workday: "hl|wd1|Campus"}
  - {name: Guggenheim Securities,    track: IB, workday: "guggenheim|wd1|Guggenheim_Careers"}
  - {name: Guggenheim (campus),      track: IB, workday: "guggenheim|wd1|Guggenheim_Careers_Campus"}
  # Analytics / fintech
  - {name: Ramp,                track: Analytics, ashby: ramp}

